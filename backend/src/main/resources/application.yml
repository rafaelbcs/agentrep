spring:
  application:
    name: agentrep-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/agentrep}
    username: ${DB_USERNAME:agentrep}
    password: ${DB_PASSWORD:agentrep}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 min

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-6
          max-tokens: 512

server:
  port: ${PORT:8080}

agentrep:
  blockchain:
    rpc-url: ${BASE_RPC_URL:https://sepolia.base.org}
    contract-address: ${CONTRACT_ADDRESS:0x0000000000000000000000000000000000000000}
    deployer-private-key: ${DEPLOYER_PRIVATE_KEY:}
    chain-id: ${CHAIN_ID:84532}  # 84532=Base Sepolia, 8453=Base Mainnet
  treasury:
    address: ${TREASURY_ADDRESS:0x0000000000000000000000000000000000000000}
  x402:
    query-price-usdc: "0.001"
    dispute-stake-usdc: "0.50"
    dispute-fee-usdc: "0.10"
    usdc-contract-address: ${USDC_ADDRESS:0x036CbD53842c5426634e7929541eC2318f3dCF7e}  # Base Sepolia USDC
  rate-limit:
    outcome-per-minute: ${RATE_LIMIT_OUTCOME:10}
    dispute-per-minute: ${RATE_LIMIT_DISPUTE:5}
    register-per-minute: ${RATE_LIMIT_REGISTER:3}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-at-least-32-chars}
    expiration-ms: 86400000  # 24h

resilience4j:
  circuitbreaker:
    instances:
      onchain:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 30s
  retry:
    instances:
      llmJudge:
        max-attempts: 2
        wait-duration: 1s
  timelimiter:
    instances:
      llmJudge:
        timeout-duration: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: agentrep

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
